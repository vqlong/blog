<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    <title>Node.js example</title>
</head>
<body>
    <div class="container">
        <h1>Danh sách khóa học</h1>
        <form id="form-add-course">
            <div class="mb-3">
                <label class="form-label" for="">Tên khóa học</label><br>
                <input class="form-control" type="text" name="name">
            </div>
            <div class="mb-3">
                <label class="form-label" for="">Miêu tả</label><br>
                <textarea class="form-control" name="description" rows="6"></textarea>
            </div>
            <input class="btn btn-success" type="submit" id="btn-add-course" value="Thêm khóa học">
        </form>
        <ul class="list-group mt-5" id="list-courses"></ul>

    </div>

    <script src="./assets/js/scripts.js"></script>
</body>
</html>
